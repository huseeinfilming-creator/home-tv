<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>شاشة البيت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Readex+Pro:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div class="stage" id="stage">

  <!-- background photography (home + photos + adhan) -->
  <div class="bg" id="bg"><div class="bg-img" id="bg-a"></div><div class="bg-img" id="bg-b"></div><div class="bg-shade" id="bg-shade"></div></div>

  <!-- ================= HOME ================= -->
  <section class="screen on" id="s-home">
    <div class="h-top">
      <div class="when">
        <div class="hijri" id="hijri"></div>
        <div class="greg" id="greg"></div>
      </div>
      <div class="sky">
        <div class="temp" id="temp"></div>
        <div class="wdesc" id="wdesc"></div>
        <div class="np" id="np-home"></div>
      </div>
    </div>

    <div class="time">
      <div class="clock" id="clock"><span class="hh">--</span><span class="colon">:</span><span class="mm">--</span></div>
      <div class="until" id="until"></div>
    </div>

    <div class="day" id="day">
      <svg class="arc" viewBox="0 0 1728 210" preserveAspectRatio="none">
        <polyline id="arc-future" class="arc-future" points=""/>
        <polyline id="arc-past" class="arc-past" points=""/>
      </svg>
      <div class="sun" id="sun"></div>
      <div id="marks"></div>
    </div>

    <div class="dhikr" id="dhikr"></div>

    <div class="dock-wrap"><div class="dock" id="dock"></div></div>
  </section>

  <!-- ================= QURAN ================= -->
  <section class="screen" id="s-quran">
    <div class="listen">
      <div class="l-state" id="q-state">اختار قارئ من القائمة</div>
      <div class="l-name" id="q-name">القرآن الكريم</div>
      <div class="l-sub" id="q-sub">إذاعات مباشرة على مدار الساعة</div>
      <div class="eq" id="q-eq"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="l-hint">OK للتشغيل أو الإيقاف · رجوع للرئيسية</div>
    </div>
    <div class="q-list"><div class="scroll-in" id="quran-list"></div></div>
  </section>

  <!-- ================= LIVE ================= -->
  <section class="screen" id="s-live">
    <div class="s-head"><h1>قنوات مباشرة</h1><p>بعض القنوات ممكن ما تشتغل حسب البلد</p></div>
    <div class="s-body"><div class="scroll-in" id="live-list"></div></div>
  </section>

  <!-- ================= NEWS / SPORTS ================= -->
  <section class="screen" id="s-news">
    <div class="s-head"><h1 id="news-title">الأخبار</h1><p id="news-sub"></p></div>
    <div class="s-body"><div class="scroll-in" id="news-list"></div></div>
  </section>

  <!-- ================= PHOTOS / SCREENSAVER ================= -->
  <section class="screen" id="s-photos">
    <div class="ph-clock" id="ph-clock"></div>
    <div class="ph-credit" id="ph-credit"></div>
  </section>

  <!-- ================= PLAYER ================= -->
  <section class="screen" id="s-player">
    <video id="video" autoplay playsinline></video>
    <div class="pl-info" id="pl-info"></div>
  </section>

  <!-- ================= ADHAN ================= -->
  <div class="adhan" id="adhan">
    <div class="ad-ring"></div>
    <div class="ad-small">حان الآن موعد</div>
    <div class="ad-name" id="ad-name"></div>
    <div class="ad-time" id="ad-time"></div>
    <div class="ad-hint">أي زر لإيقاف الأذان</div>
    <div class="ad-credit" id="ad-credit"></div>
  </div>
  <div class="pager" id="pager"><div class="pg up" id="pg-up"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></div><div class="pg down" id="pg-down"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div></div>
  <div class="backbtn" id="backbtn"><svg viewBox="0 0 24 24" fill="none" stroke="#F2EDE3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg><span>رجوع</span></div>
  <div class="toast" id="toast"></div>
</div>

<script src="app.js?v=4"></script>
</body>
</html>
