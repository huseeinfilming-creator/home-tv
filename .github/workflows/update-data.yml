name: update-data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "tools/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Refresh data files
        run: python3 tools/update_data.py
      - name: Commit changes
        run: |
          git config user.name "home-tv-bot"
          git config user.email "home-tv-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
