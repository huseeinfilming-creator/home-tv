<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>شاشة البيت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="stage" id="stage">

  <!-- ================= HOME ================= -->
  <section class="screen on" id="s-home">
    <div class="top">
      <div class="clock-wrap">
        <div class="greet" id="greet">أهلاً بالبيت</div>
        <div class="clock" id="clock">--:--</div>
        <div class="dates"><span id="hijri"></span><span id="greg"></span></div>
      </div>
      <div class="side">
        <div class="weather">
          <div class="temp" id="temp">--°</div>
          <div class="desc" id="wdesc"> </div>
          <div class="city">إسطنبول</div>
        </div>
        <div class="np" id="np-home"></div>
      </div>
    </div>
    <div class="prayers" id="prayers"></div>
    <div class="countdown" id="countdown"></div>
    <div class="dhikr" id="dhikr"></div>
    <div class="ticker" id="ticker"></div>
    <div class="apps-wrap"><div class="apps" id="apps"></div></div>
  </section>

  <!-- ================= QURAN ================= -->
  <section class="screen" id="s-quran">
    <div class="head"><div class="h-title">القرآن الكريم</div><div class="h-sub">إذاعات مباشرة على مدار الساعة · OK للتشغيل والإيقاف</div></div>
    <div class="scroll" id="quran-list"></div>
    <div class="np-bar" id="np-quran"></div>
  </section>

  <!-- ================= LIVE ================= -->
  <section class="screen" id="s-live">
    <div class="head"><div class="h-title">قنوات مباشرة</div><div class="h-sub">قنوات مجانية · بعضها ممكن ما يشتغل حسب البلد</div></div>
    <div class="scroll" id="live-list"></div>
  </section>

  <!-- ================= NEWS / SPORTS ================= -->
  <section class="screen" id="s-news">
    <div class="head"><div class="h-title" id="news-title">الأخبار</div><div class="h-sub" id="news-sub"></div></div>
    <div class="scroll" id="news-list"></div>
  </section>

  <!-- ================= PHOTOS / SCREENSAVER ================= -->
  <section class="screen" id="s-photos">
    <div class="ph" id="ph-a"></div><div class="ph" id="ph-b"></div>
    <div class="ph-shade"></div>
    <div class="ph-clock" id="ph-clock"></div>
    <div class="ph-credit" id="ph-credit"></div>
  </section>

  <!-- ================= PLAYER ================= -->
  <section class="screen" id="s-player">
    <video id="video" autoplay playsinline></video>
    <div class="pl-info" id="pl-info"></div>
  </section>

  <!-- ================= ADHAN ================= -->
  <div class="overlay" id="adhan">
    <div class="ad-small">حان الآن موعد</div>
    <div class="ad-name" id="ad-name">أذان الظهر</div>
    <div class="ad-time" id="ad-time"></div>
    <div class="ad-hint">أي زر لإيقاف الأذان</div>
    <div class="ad-credit" id="ad-credit"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="app.js?v=3"></script>
</body>
</html>
